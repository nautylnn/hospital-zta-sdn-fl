---
# ==============================================================================
# HOSPITAL ZTA + SDN + FEDERATED LEARNING — SINGLE SOURCE OF TRUTH (SSOT)
# Nâng cấp từ: hospital_network/yaml/hospital_network_design.yml (Code Member 1)
# Ghi chú: Toàn bộ VLAN, SVI/HSRP, DHCP Pools, DC Servers, ACL & Port Profiles
#          đều đọc từ file này để tránh lệch cấu hình giữa 3 thành viên.
# ==============================================================================

global_settings:
  domain_name: "hospital.local"
  dhcp_server_ip: "192.168.200.12"
  stp_mode: "pvst"
  # Chuẩn hóa DMZ VLAN về 210 xuyên suốt code & báo cáo (lưu ý cập nhật nhãn 201 trên hình vẽ thành 210)
  dmz_vlan_id: 210
  oob_vlan_id: 999
  # Dải VLAN dữ liệu cho phép đi qua Trunk (Tuyệt đối loại trừ 210 DMZ và 999 OOB)
  trunk_allowed_vlans: "10,20,30,60,70,80,200,220,230,300"
  # Dải CGNAT của Tailscale dùng cho truy cập quản trị từ xa qua VPN nhóm 3 người
  tailscale_cgnat_network: "100.64.0.0"
  tailscale_cgnat_wildcard: "0.63.255.255"

# ------------------------------------------------------------------------------
# 1. DANH MỤC TOÀN BỘ VLAN TRONG BỆNH VIỆN (CHÍNH XÁC 12 VLANs)
# ------------------------------------------------------------------------------
hospital_vlans:
  # --- TÒA NHÀ A (BUILDING A - CLINICAL FLOORS 1..3) ---
  - vlan_id: 10
    name: BLD_A_FLOOR1_CLINICAL
  - vlan_id: 20
    name: BLD_A_FLOOR2_CLINICAL
  - vlan_id: 30
    name: BLD_A_FLOOR3_CLINICAL

  # --- TÒA NHÀ B (BUILDING B - CLINICAL FLOORS 1..3) ---
  - vlan_id: 60
    name: BLD_B_FLOOR1_CLINICAL
  - vlan_id: 70
    name: BLD_B_FLOOR2_CLINICAL
  - vlan_id: 80
    name: BLD_B_FLOOR3_CLINICAL

  # --- DATA CENTER & DMZ ---
  - vlan_id: 200
    name: DATA_CENTER_SERVERS
  - vlan_id: 210
    name: DMZ_PUBLIC_WEB_WAF

  # --- GUEST WIFI NETWORKS (TÒA B & TÒA A) ---
  - vlan_id: 220
    name: GUEST_WIFI_BLD_B
  - vlan_id: 230
    name: GUEST_WIFI_BLD_A

  # --- VÙNG CÁCH LY THIẾT BỊ Y TẾ (IoMT) ---
  - vlan_id: 300
    name: IOMT_MEDICAL_DEVICES

  # --- VÙNG QUẢN TRỊ OUT-OF-BAND (OOB MANAGEMENT) ---
  - vlan_id: 999
    name: OOB_MANAGEMENT_NET

# ------------------------------------------------------------------------------
# 2. QUY HOẠCH IP 4 SERVER TRONG DATA CENTER (VLAN 200 - HOSPITAL-SERVERS)
# ------------------------------------------------------------------------------
dc_servers:
  server1_sdn_zta:
    ip: "192.168.200.10"
    prefix: 24
    role: "SDN Controller (OS-Ken/Ryu) + ZTA Policy Engine & Policy Administrator"
  server2_fl_aggregator:
    ip: "192.168.200.11"
    prefix: 24
    role: "Federated Learning Aggregator (Flower / FedAvg)"
  server3_hospital_apps:
    ip: "192.168.200.12"
    prefix: 24
    role: "DHCP (dnsmasq) + EHR/PACS + Mock IoT HTTP (:8080) + MQTT (:1883)"
  server4_security_ops:
    ip: "192.168.200.13"
    prefix: 24
    role: "SIEM (Wazuh) + FreeRADIUS (802.1X) + Step-CA PKI"

# ------------------------------------------------------------------------------
# 3. CÂN BẰNG TẢI STP PVST & HSRP ACTIVE/ACTIVE TRÊN 2 CORE SWITCHES
# - Nhóm A (SW-CORE-01 Active [150], SW-CORE-02 Standby [100]): VLAN 10, 20, 30, 200, 230
# - Nhóm B (SW-CORE-02 Active [150], SW-CORE-01 Standby [100]): VLAN 60, 70, 80, 220, 300
# ------------------------------------------------------------------------------
stp_load_balancing:
  SW-CORE-01:
    root_primary_vlans: "10,20,30,200,230"
    root_secondary_vlans: "60,70,80,220,300"
  SW-CORE-02:
    root_primary_vlans: "60,70,80,220,300"
    root_secondary_vlans: "10,20,30,200,230"

core_svi_hsrp:
  # === NHÓM A: SW-CORE-01 ACTIVE (150), SW-CORE-02 STANDBY (100) ===
  - vlan_id: 10
    hsrp_group: 1
    vip: "192.168.10.1"
    core1_ip: "192.168.10.2"
    core2_ip: "192.168.10.3"
    core1_priority: 150
    core2_priority: 100
    netmask: "255.255.255.0"
    dhcp_helper: "192.168.200.12"
    dhcp_pool_start: "192.168.10.10"
    dhcp_pool_end: "192.168.10.100"
    acl_in: "CLINICAL_PROTECT_OOB"

  - vlan_id: 20
    hsrp_group: 2
    vip: "192.168.20.1"
    core1_ip: "192.168.20.2"
    core2_ip: "192.168.20.3"
    core1_priority: 150
    core2_priority: 100
    netmask: "255.255.255.0"
    dhcp_helper: "192.168.200.12"
    dhcp_pool_start: "192.168.20.10"
    dhcp_pool_end: "192.168.20.100"
    acl_in: "CLINICAL_PROTECT_OOB"

  - vlan_id: 30
    hsrp_group: 3
    vip: "192.168.30.1"
    core1_ip: "192.168.30.2"
    core2_ip: "192.168.30.3"
    core1_priority: 150
    core2_priority: 100
    netmask: "255.255.255.0"
    dhcp_helper: "192.168.200.12"
    dhcp_pool_start: "192.168.30.10"
    dhcp_pool_end: "192.168.30.100"
    acl_in: "CLINICAL_PROTECT_OOB"

  - vlan_id: 200
    hsrp_group: 20
    vip: "192.168.200.1"
    core1_ip: "192.168.200.2"
    core2_ip: "192.168.200.3"
    core1_priority: 150
    core2_priority: 100
    netmask: "255.255.255.0"
    dhcp_helper: "192.168.200.12"

  - vlan_id: 230
    hsrp_group: 23
    vip: "192.168.230.1"
    core1_ip: "192.168.230.2"
    core2_ip: "192.168.230.3"
    core1_priority: 150
    core2_priority: 100
    netmask: "255.255.255.0"
    dhcp_helper: "192.168.200.12"
    dhcp_pool_start: "192.168.230.10"
    dhcp_pool_end: "192.168.230.100"
    acl_in: "GUEST"

  # === NHÓM B: SW-CORE-02 ACTIVE (150), SW-CORE-01 STANDBY (100) ===
  - vlan_id: 60
    hsrp_group: 6
    vip: "192.168.60.1"
    core1_ip: "192.168.60.2"
    core2_ip: "192.168.60.3"
    core1_priority: 100
    core2_priority: 150
    netmask: "255.255.255.0"
    dhcp_helper: "192.168.200.12"
    dhcp_pool_start: "192.168.60.10"
    dhcp_pool_end: "192.168.60.100"
    acl_in: "CLINICAL_PROTECT_OOB"

  - vlan_id: 70
    hsrp_group: 7
    vip: "192.168.70.1"
    core1_ip: "192.168.70.2"
    core2_ip: "192.168.70.3"
    core1_priority: 100
    core2_priority: 150
    netmask: "255.255.255.0"
    dhcp_helper: "192.168.200.12"
    dhcp_pool_start: "192.168.70.10"
    dhcp_pool_end: "192.168.70.100"
    acl_in: "CLINICAL_PROTECT_OOB"

  - vlan_id: 80
    hsrp_group: 8
    vip: "192.168.80.1"
    core1_ip: "192.168.80.2"
    core2_ip: "192.168.80.3"
    core1_priority: 100
    core2_priority: 150
    netmask: "255.255.255.0"
    dhcp_helper: "192.168.200.12"
    dhcp_pool_start: "192.168.80.10"
    dhcp_pool_end: "192.168.80.100"
    acl_in: "CLINICAL_PROTECT_OOB"

  - vlan_id: 220
    hsrp_group: 22
    vip: "192.168.220.1"
    core1_ip: "192.168.220.2"
    core2_ip: "192.168.220.3"
    core1_priority: 100
    core2_priority: 150
    netmask: "255.255.255.0"
    dhcp_helper: "192.168.200.12"
    dhcp_pool_start: "192.168.220.10"
    dhcp_pool_end: "192.168.220.100"
    acl_in: "GUEST"

  # --- SVI CHO VÙNG THIẾT BỊ Y TẾ IoMT (VLAN 300 - SW-CORE-02 Active) ---
  - vlan_id: 300
    hsrp_group: 30
    vip: "192.168.180.1"
    core1_ip: "192.168.180.2"
    core2_ip: "192.168.180.3"
    core1_priority: 100
    core2_priority: 150
    netmask: "255.255.255.0"
    dhcp_helper: "192.168.200.12"
    dhcp_pool_start: "192.168.180.10"
    dhcp_pool_end: "192.168.180.100"
    acl_in: "IOMT_ZTA_BASELINE"

# ------------------------------------------------------------------------------
# 4. CẤU HÌNH UPLINK L3 TỪ CORE LÊN FIREWALL U3 (NGFW)
# ------------------------------------------------------------------------------
core_l3_uplinks:
  SW-CORE-01:
    uplink_port: "GigabitEthernet0/1"
    ip: "192.168.1.2"
    netmask: "255.255.255.0"
    next_hop_firewall: "192.168.1.1"
  SW-CORE-02:
    uplink_port: "GigabitEthernet0/1"
    ip: "192.168.2.2"
    netmask: "255.255.255.0"
    next_hop_firewall: "192.168.2.1"

# ------------------------------------------------------------------------------
# 5. CHÍNH SÁCH AN NINH ACL ĐÃ VÁ LỖ HỔNG (ZERO-TRUST BASELINE)
# ------------------------------------------------------------------------------
security_acls:
  GUEST:
    # Cho phép gia hạn DHCP unicast tới Server 3
    - "permit udp 192.168.220.0 0.0.0.255 host 192.168.200.12 eq bootps"
    - "permit udp 192.168.230.0 0.0.0.255 host 192.168.200.12 eq bootps"
    # VÁ LỖ HỔNG: Chặn TOÀN BỘ IP (ICMP + TCP + UDP) từ Guest vào mạng nội bộ & Data Center
    - "deny ip 192.168.220.0 0.0.0.255 192.168.0.0 0.0.255.255 log"
    - "deny ip 192.168.230.0 0.0.0.255 192.168.0.0 0.0.255.255 log"
    # Chặn tuyệt đối truy cập vào mạng quản trị OOB & các dải nội bộ khác
    - "deny ip any {{ oob_network }} {{ oob_wildcard }} log"
    - "deny ip any 10.0.0.0 0.255.255.255"
    - "deny ip any 172.16.0.0 0.15.255.255"
    # Chỉ cho phép Guest đi ra Internet
    - "permit ip any any"

  IOMT_ZTA_BASELINE:
    # 0. Cho phép gói tin HSRP Hello giữa 2 Core Switch (tránh lỗi HSRP Split-Brain)
    - "permit udp 192.168.180.0 0.0.0.255 host 224.0.0.2 eq 1985"
    # 1. Cho phép xin/gia hạn IP DHCP từ Server 3
    - "permit udp any eq bootpc host 255.255.255.255 eq bootps"
    - "permit udp any host 192.168.200.12 eq bootps"
    # 2. Chỉ cho phép giao tiếp đúng cổng dịch vụ y tế tới Server 3 (.200.12) & SIEM (.200.13)
    - "permit tcp 192.168.180.0 0.0.0.255 host 192.168.200.12 eq 8080"
    - "permit tcp 192.168.180.0 0.0.0.255 host 192.168.200.12 eq 443"
    - "permit tcp 192.168.180.0 0.0.0.255 host 192.168.200.12 eq 1883"
    - "permit tcp 192.168.180.0 0.0.0.255 host 192.168.200.13 eq 1514"
    - "permit tcp 192.168.180.0 0.0.0.255 host 192.168.200.13 eq 1515"
    # 3. Cấm tuyệt đối Lateral Movement sang VLAN Bác sĩ, DC khác và OOB Management
    - "deny ip 192.168.180.0 0.0.0.255 192.168.0.0 0.0.255.255 log"
    - "deny ip any {{ oob_network }} {{ oob_wildcard }} log"
    # 4. VÁ LỖ HỔNG: Default-Deny — không cho thiết bị y tế tự do đi Internet
    - "deny ip any any log"

  CLINICAL_PROTECT_OOB:
    # Chặn máy trạm lâm sàng chạm tới vùng quản trị OOB VLAN 999
    - "deny ip any {{ oob_network }} {{ oob_wildcard }} log"
    - "permit ip any any"

vty_access_list:
  name: "OOB_VTY_ONLY"
  lines:
    - "permit {{ oob_network }} {{ oob_wildcard }}"
    - "permit {{ global_settings.tailscale_cgnat_network }} {{ global_settings.tailscale_cgnat_wildcard }}"
    - "deny any log"

# ------------------------------------------------------------------------------
# 6. PHÂN BỔ CỔNG TRUNK & ACCESS TRÊN CÁC SWITCH
# ------------------------------------------------------------------------------
switch_port_profiles:
  SW-CORE-01:
    trunks:
      - port: "GigabitEthernet0/2"
        description: "TRUNK_INTERLINK_TO_SW_CORE_02"
      - port: "GigabitEthernet0/3"
        description: "TRUNK_DOWNLINK_TO_SW_BLD_A"
      - port: "GigabitEthernet1/0"
        description: "TRUNK_DOWNLINK_TO_SW_BLD_B"
      - port: "GigabitEthernet1/1"
        description: "TRUNK_DOWNLINK_TO_SW_IOMT"
      - port: "GigabitEthernet1/2"
        description: "TRUNK_DOWNLINK_TO_SW_DC"
    access: []

  SW-CORE-02:
    trunks:
      - port: "GigabitEthernet0/2"
        description: "TRUNK_INTERLINK_TO_SW_CORE_01"
      - port: "GigabitEthernet0/3"
        description: "TRUNK_DOWNLINK_TO_SW_BLD_A"
      - port: "GigabitEthernet1/0"
        description: "TRUNK_DOWNLINK_TO_SW_BLD_B"
      - port: "GigabitEthernet1/1"
        description: "TRUNK_DOWNLINK_TO_SW_IOMT"
      - port: "GigabitEthernet1/2"
        description: "TRUNK_DOWNLINK_TO_SW_DC"
    access: []

  SW-BLD-A:
    span_target_note: "Bước 2 chuyển sang/gắn OVS-BLD-A để bật SPAN thật sang Edge A & OpenFlow 1.3"
    trunks:
      - port: "GigabitEthernet0/1"
        description: "UPLINK_TO_SW_CORE_01"
      - port: "GigabitEthernet0/2"
        description: "UPLINK_TO_SW_CORE_02"
    access:
      - port: "GigabitEthernet0/3"
        vlan: 10
        description: "BLD_A_FLOOR1_WORKSTATIONS"
      - port: "GigabitEthernet1/0"
        vlan: 20
        description: "BLD_A_FLOOR2_WORKSTATIONS"
      - port: "GigabitEthernet1/1"
        vlan: 30
        description: "BLD_A_FLOOR3_WORKSTATIONS"
      - port: "GigabitEthernet1/2"
        vlan: 230
        description: "BLD_A_GUEST_WIFI_AP"

  SW-BLD-B:
    span_target_note: "Bước 2 chuyển sang/gắn OVS-BLD-B để bật SPAN thật sang Edge B & OpenFlow 1.3"
    trunks:
      - port: "GigabitEthernet0/1"
        description: "UPLINK_TO_SW_CORE_01"
      - port: "GigabitEthernet0/2"
        description: "UPLINK_TO_SW_CORE_02"
    access:
      - port: "GigabitEthernet0/3"
        vlan: 60
        description: "BLD_B_FLOOR1_WORKSTATIONS"
      - port: "GigabitEthernet1/0"
        vlan: 70
        description: "BLD_B_FLOOR2_WORKSTATIONS"
      - port: "GigabitEthernet1/1"
        vlan: 80
        description: "BLD_B_FLOOR3_WORKSTATIONS"
      - port: "GigabitEthernet1/2"
        vlan: 220
        description: "BLD_B_GUEST_WIFI_AP"

  SW-IOMT:
    span_target_note: "Bước 2 chuyển sang OVS-IOMT đầu tiên để bật SPAN thật sang Edge IoMT & OpenFlow PEP"
    trunks:
      - port: "GigabitEthernet0/1"
        description: "UPLINK_TO_SW_CORE_01"
      - port: "GigabitEthernet0/2"
        description: "UPLINK_TO_SW_CORE_02"
    access:
      - port: "GigabitEthernet0/3"
        vlan: 300
        description: "IOMT_PATIENT_MONITOR_AND_PUMP"
      - port: "GigabitEthernet1/0"
        vlan: 300
        description: "IOMT_SMART_BED_AND_SENSORS"
      - port: "GigabitEthernet1/1"
        vlan: 300
        description: "IOMT_IP_CAMERA_SURVEILLANCE"

  SW-DC:
    trunks:
      - port: "GigabitEthernet0/1"
        description: "UPLINK_TO_SW_CORE_01"
      - port: "GigabitEthernet0/2"
        description: "UPLINK_TO_SW_CORE_02"
    access:
      - port: "GigabitEthernet0/3"
        vlan: 200
        description: "SERVER1_ZTA_PE_PA_SDN_CONTROLLER"
      - port: "GigabitEthernet1/0"
        vlan: 200
        description: "SERVER2_FL_AGGREGATOR_FLOWER"
      - port: "GigabitEthernet1/1"
        vlan: 200
        description: "SERVER3_CLOUD1_HOSPITAL_SERVERS"
      - port: "GigabitEthernet1/2"
        vlan: 200
        description: "SERVER4_SIEM_WAZUH_FREERADIUS_PKI"

  SW-DMZ:
    trunks: []
    access:
      - port: "GigabitEthernet0/1"
        vlan: 210
        description: "UPLINK_TO_FIREWALL_U3_DMZ_PORT"
      - port: "GigabitEthernet0/2"
        vlan: 210
        description: "DMZ_WAF_PUBLIC_WEB_192_168_210_3"
      - port: "GigabitEthernet0/3"
        vlan: 210
        description: "DMZ_PUBLIC_DNS_192_168_210_4"
