# Profile: lead_lite (TH3 - Laptop 16GB RAM của Nhóm trưởng chạy nhánh thu gọn)
# Lưu ý: Mặc định chỉ bật SW-CORE-01 + SW-IOMT + SW-DC để vừa 8GB RAM EVE-NG VM.
# Bỏ dấu '#' ở các Switch khác nếu máy đủ RAM hoặc muốn test thêm phân khu.

[core_switches]
SW-CORE-01 ansible_host=192.168.5.51 hsrp_role=active_group_A
# SW-CORE-02 ansible_host=192.168.5.52 hsrp_role=active_group_B

[access_switches]
# SW-BLD-A ansible_host=192.168.5.53
# SW-BLD-B ansible_host=192.168.5.54
SW-IOMT ansible_host=192.168.5.55
SW-DC ansible_host=192.168.5.56
# SW-DMZ ansible_host=192.168.5.57

[all_switches:children]
core_switches
access_switches

[all_switches:vars]
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
ansible_user={{ ios_user }}
ansible_password={{ ios_password }}
ansible_become=yes
ansible_become_method=enable
ansible_become_password={{ ios_enable_password }}
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o Ciphers=+aes128-cbc,aes256-cbc,aes128-ctr,aes256-ctr -o StrictHostKeyChecking=no'

[hospital_servers]
# Cập nhật IP khớp với card ens34 (VMnet8 NAT) của VM HOSPITAL-SERVERS trên máy bạn
HOSPITAL-SERVERS ansible_host=192.168.5.100

[hospital_servers:vars]
ansible_connection=ssh
ansible_user={{ server_user }}
ansible_password={{ server_password }}
ansible_become=yes
ansible_become_method=sudo
ansible_become_password={{ server_password }}
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
