# Profile: member2_local (TH3 - Máy Member 2 chạy độc lập trên VMware VMnet8)
# Hướng dẫn nhanh cho Member 2:
#   1. Kiểm tra subnet VMware VMnet8 (NAT) trên máy bạn (Virtual Network Editor hoặc `ip -4 a show ens34`).
#   2. Thay thế dải mẫu `192.168.100` bên dưới (và trong group_vars/all.yml) bằng subnet VMnet8 thực tế của bạn.
#   3. Cập nhật IP của HOSPITAL-SERVERS khớp đúng với IP card ens34 trên VM của bạn.
#   4. Nếu máy có 16GB RAM như laptop Nhóm trưởng, có thể thêm dấu '#' trước SW-CORE-02, SW-BLD-A, SW-BLD-B, SW-DMZ.

[core_switches]
SW-CORE-01 ansible_host=192.168.100.51 hsrp_role=active_group_A
SW-CORE-02 ansible_host=192.168.100.52 hsrp_role=active_group_B

[access_switches]
SW-BLD-A ansible_host=192.168.100.53
SW-BLD-B ansible_host=192.168.100.54
SW-IOMT ansible_host=192.168.100.55
SW-DC ansible_host=192.168.100.56
SW-DMZ ansible_host=192.168.100.57

[all_switches:children]
core_switches
access_switches

[all_switches:vars]
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
ansible_user={{ ios_user }}
ansible_password={{ ios_password }}
ansible_become=yes
ansible_become_method=enable
ansible_become_password={{ ios_enable_password }}
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o Ciphers=+aes128-cbc,aes256-cbc,aes128-ctr,aes256-ctr -o StrictHostKeyChecking=no'

[hospital_servers]
# Cập nhật IP bên dưới khớp với card ens34 (VMnet8 NAT) của VM HOSPITAL-SERVERS trên máy Member 2
HOSPITAL-SERVERS ansible_host=192.168.100.100

[hospital_servers:vars]
ansible_connection=ssh
ansible_user={{ server_user }}
ansible_password={{ server_password }}
ansible_become=yes
ansible_become_method=sudo
ansible_become_password={{ server_password }}
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
