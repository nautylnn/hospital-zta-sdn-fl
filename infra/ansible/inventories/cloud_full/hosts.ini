# Profile: cloud_full (TH1a Server Trường / TH2 Cloud GCP-Azure dùng Cloud1 OOB nội bộ + Tailscale)
# Lưu ý: Nối Gi0/0 của 7 Switch vào Cloud1 (pnet1: 10.99.0.0/24) và bật Tailscale Subnet Router trên host EVE-NG.

[core_switches]
SW-CORE-01 ansible_host=10.99.0.51 hsrp_role=active_group_A
SW-CORE-02 ansible_host=10.99.0.52 hsrp_role=active_group_B

[access_switches]
SW-BLD-A ansible_host=10.99.0.53
SW-BLD-B ansible_host=10.99.0.54
SW-IOMT ansible_host=10.99.0.55
SW-DC ansible_host=10.99.0.56
SW-DMZ ansible_host=10.99.0.57

[all_switches:children]
core_switches
access_switches

[all_switches:vars]
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
ansible_user={{ ios_user }}
ansible_password={{ ios_password }}
ansible_become=yes
ansible_become_method=enable
ansible_become_password={{ ios_enable_password }}
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o Ciphers=+aes128-cbc,aes256-cbc,aes128-ctr,aes256-ctr -o StrictHostKeyChecking=no'

[hospital_servers]
# IP quản trị của node/VM HOSPITAL-SERVERS trên mạng OOB Cloud1 (10.99.0.0/24)
HOSPITAL-SERVERS ansible_host=10.99.0.100

[hospital_servers:vars]
ansible_connection=ssh
ansible_user={{ server_user }}
ansible_password={{ server_password }}
ansible_become=yes
ansible_become_method=sudo
ansible_become_password={{ server_password }}
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
